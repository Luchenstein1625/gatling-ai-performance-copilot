[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "performance-decision-engine"
version = "0.1.0"
description = "Motor de decisión para configuraciones de pruebas de rendimiento"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Luis Araya" },
  { name = "Rodrigo González" },
  { name = "Hernán Medina" }
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6",
  "black>=24.4,<25",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<4",
  "types-PyYAML>=6.0,<7"
]

[project.scripts]
pde = "performance_decision_engine.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["performance_decision_engine"]
