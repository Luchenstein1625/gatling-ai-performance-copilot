    reason_detail: "Endpoint para obtener configuracion de cupones por ID de configuracion"
    concurrency: medium
    iterations: medium
    response_time: medium
    operation_id: "MSCouponsController_getCouponsConfigByConfigId"
  - name: crear-configuracion-cupones
    feature: classpath:cl/bci/ecodig/acceptance/crear-configuracion-cupones.feature@name=crear-configuracion-cupones
    performance: false
    reason: "Sin datos de prueba"
    reason_detail: "Endpoint para crear nueva configuracion de cupones"
    concurrency: low
    iterations: low
    response_time: high
    operation_id: "MSCouponsController_createCouponsConfig"
  - name: actualizar-configuracion-cupones
    feature: classpath:cl/bci/ecodig/acceptance/actualizar-configuracion-cupones.feature@name=actualizar-configuracion-cupones
    performance: false
    reason: "Sin datos de prueba"
    reason_detail: "Endpoint para actualizar configuracion existente de cupones"
